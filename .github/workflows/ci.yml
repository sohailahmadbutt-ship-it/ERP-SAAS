name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://erp_app:erp_app@localhost:5432/erp
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create app database role (non-superuser so row-level security applies)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -f docker/init-db.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma:migrate
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
